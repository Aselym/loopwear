databases:
  - name: loopwear-db
    plan: free
    databaseName: loopwear
    user: loopwear

services:
  - type: web
    name: loopwear
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: loopwear-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: yonetici@loopwear.app
      - key: ADMIN_PASSWORD
        generateValue: true
